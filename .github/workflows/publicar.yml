# Conferir e publicar (20/10/2026)
#
# Por que a publicação passa por aqui, e não pelo "publicar a partir da branch" do GitHub Pages: a conferência do
# repositório tem de rodar ANTES de qualquer publicação, de qualquer frente (FRONTEIRA_APP_COMPEL, §4). Publicando
# direto da branch, o celular receberia o arquivo errado e a conferência só acusaria depois.
#
# Para funcionar, o GitHub Pages do repositório fica em "Settings › Pages › Source: GitHub Actions".
#
# Limite conhecido: a regra das áreas (uma área por envio) olha os commits deste envio. Se um envio for recusado só por
# ela, o envio seguinte, que passe, publica junto o anterior. As regras 1 a 4 olham a árvore inteira e não têm esse
# furo.

name: Conferir e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: O teste da conferência (ela tem de recusar cada caso errado)
        run: node conferencia/teste.js
      # 21/10/2026: a casca tem telas, e a bateria dela abre o app no Chromium nas larguras de celular. É aqui que
      # entram as duas regras prometidas para quando houvesse tela: toda tela com ajuda, e nenhuma passando de 360 e
      # 412 px. A versão do Playwright é a mesma com que a bateria foi escrita e quebrada de propósito.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: A bateria da casca (entrada, Início, Avisos, Envio, Perfil, sem sinal, os blocos e o segundo plano)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
          node testes/casca.js
      - name: A conferência da árvore e das áreas deste envio
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE" 2>/dev/null; then
            node conferencia/conferir.js --desde "$BASE"
          else
            node conferencia/conferir.js
          fi

  publicar:
    needs: conferir
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 21/10/2026: o que vai ao celular é o app, e não o repositório inteiro. A bateria e a conferência ficam de fora
      # (a bateria tem um bloco de exemplo que não pode aparecer no app publicado), e o índice dos blocos é montado
      # aqui, a partir dos bloco.json, com a mesma leitura da conferência (conferencia/indice.js explica por quê).
      - name: Montar o site e o índice dos blocos
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./testes --exclude=./conferencia --exclude=./node_modules --exclude=./_site -cf - . | tar -xf - -C _site
          node conferencia/indice.js --raiz _site
          test -f _site/blocos/indice.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: publicacao
        uses: actions/deploy-pages@v4
