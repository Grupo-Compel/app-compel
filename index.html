<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d5e">
<title>App Compel</title>
<!--
  PÁGINA PROVISÓRIA (20/10/2026). O repositório nasceu hoje e a casca ainda não tem tela: a entrada depende do login
  do Núcleo, que nasce num projeto novo (carta nº 8 do Núcleo). De propósito, esta página não registra service worker:
  um service worker instalado agora guardaria esta página provisória nos celulares de quem abrir o endereço por
  curiosidade, e a casca de verdade teria de desalojá-la.
-->
<style>
  :root { --fundo: #f4f6f8; --texto: #1c2733; --suave: #5b6b7a; --marca: #0f3d5e; --cartao: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #11171d; --texto: #e6ebf0; --suave: #9aa8b5; --marca: #7fb8e0; --cartao: #1a232c; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
         background: var(--fundo); color: var(--texto); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 420px; width: 100%; background: var(--cartao); border-radius: 16px; padding: 28px 24px;
         box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  h1 { margin: 0 0 4px; font-size: 24px; color: var(--marca); }
  p { margin: 12px 0 0; color: var(--suave); }
</style>
</head>
<body>
<main>
  <h1>App Compel</h1>
  <p>O aplicativo de quem vai a campo está sendo construído.</p>
  <p>Quando ele estiver pronto, o seu supervisor avisa e diz como instalar.</p>
</main>
</body>
</html>
