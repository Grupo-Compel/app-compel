<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#231F20">
<title>App Compel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<!--
  A CASCA DO APP COMPEL (21/10/2026). Entrada, Início, Avisos e Perfil; os blocos de cada frente entram depois, cada um
  na pasta dele (blocos/<bloco>/).

  O visual é o do app do campo da Operação (grafite e vermelho, fonte do sistema), porque é o que o pessoal de campo já
  conhece (protótipo do App, 15/10/2026: "visual igual ao do app de campo"). Fonte do sistema de propósito: em campo não
  há sinal para baixar fonte, e o app tem de abrir igual com e sem rede. Só tema claro, como o do campo: a tela é lida
  no sol.
-->
<style>
  :root {
    color-scheme: light;
    --fundo:#F4F5F7; --superficie:#FFFFFF; --tinta:#231F20; --tinta-media:#5A5C63; --tinta-fraca:#80838B; --linha:#E2E4E8;
    --vermelho:#ED1C24; --vermelho-forte:#B2101F; --vermelho-claro:#FDEBEC;
    --ambar:#8A5600; --ambar-claro:#FFF3DC; --verde:#0E7A47; --verde-claro:#E4F4EB; --grafite:#231F20;
    --azul:#1F5E8C; --azul-claro:#E6EFF6; --raio:10px; --toque:48px;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--fundo); color:var(--tinta); font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display:flex; flex-direction:column; }
  button, input { font:inherit; color:inherit; }
  .oculto { display:none !important; }
  .topo { background:var(--grafite); color:#fff; padding:calc(10px + env(safe-area-inset-top,0px)) 14px 9px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  .topo .t { font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:14px; }
  .topo .cod { font-size:10px; letter-spacing:.14em; color:rgba(255,255,255,.55); margin-left:auto; }
  .sinal { font-size:12px; font-weight:600; padding:3px 9px; border-radius:12px; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .sinal::before { content:''; width:8px; height:8px; border-radius:50%; background:currentColor; }
  .sinal.off { background:#4A3A12; color:#FFC95C; } .sinal.on { background:#123A26; color:#6FE0A5; }
  .barra-versao { background:var(--azul); color:#fff; border:0; width:100%; min-height:var(--toque); font-weight:700; cursor:pointer; }
  main { flex:1; overflow-y:auto; padding:12px 12px 24px; display:grid; gap:10px; align-content:start; max-width:640px; width:100%; margin:0 auto; }
  main > * { min-width:0; }
  .cartao { background:var(--superficie); border:1.5px solid #C9CED6; border-radius:var(--raio); padding:13px; box-shadow:0 1px 3px rgba(35,31,32,.08); }
  .cartao > .etiqueta:first-child { margin:-13px -13px 10px; padding:9px 13px; background:#EEF0F3; border-bottom:1.5px solid #C9CED6; border-radius:var(--raio) var(--raio) 0 0; color:var(--tinta); display:flex; align-items:center; gap:8px; }
  .etiqueta { font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--tinta-media); }
  .etiqueta .ajudar { margin-left:auto; flex:none; width:30px; height:30px; border-radius:50%; border:1.5px solid #9BA1AB; background:#fff; color:var(--tinta-media); font-weight:800; cursor:pointer; letter-spacing:0; }
  .texto-ajuda { background:var(--azul-claro); color:var(--azul); border-radius:8px; padding:10px 12px; font-size:14px; margin-bottom:10px; }
  .media { color:var(--tinta-media); } .fraco { color:var(--tinta-fraca); }
  label { display:block; font-size:13px; color:var(--tinta-media); margin:10px 0 4px; }
  input { width:100%; min-height:var(--toque); padding:10px 11px; border:1.5px solid var(--linha); border-radius:8px; background:#fff; }
  input:focus { outline:3px solid var(--azul-claro); border-color:var(--azul); }
  .btn { display:block; width:100%; margin-top:10px; min-height:52px; padding:12px; border:0; border-radius:8px; background:var(--vermelho); color:#fff; font-weight:700; font-size:16px; cursor:pointer; text-align:center; text-decoration:none; }
  .btn.fantasma { background:transparent; color:var(--tinta-media); border:1.5px solid var(--linha); font-weight:600; }
  .btn.medio { min-height:var(--toque); font-size:14px; }
  .btn:disabled { opacity:.45; cursor:default; }
  .aviso { padding:10px 12px; border-radius:8px; font-size:14px; background:var(--azul-claro); color:var(--azul); margin-top:10px; }
  .aviso.atencao { background:var(--ambar-claro); color:var(--ambar); } .aviso.erro { background:var(--vermelho-claro); color:var(--vermelho-forte); } .aviso.ok { background:var(--verde-claro); color:var(--verde); }
  .chip { display:inline-block; font-size:12px; font-weight:700; padding:2px 9px; border-radius:12px; background:var(--azul-claro); color:var(--azul); white-space:nowrap; }
  .chip.novo { background:var(--vermelho); color:#fff; } .chip.breve { background:#ECEDF0; color:var(--tinta-media); } .chip.travado { background:var(--ambar-claro); color:var(--ambar); }
  .pessoas { display:grid; gap:8px; }
  .pessoas button { display:flex; align-items:center; gap:10px; width:100%; min-height:56px; padding:8px 12px; border:1.5px solid #C9CED6; border-radius:8px; background:#fff; cursor:pointer; text-align:left; }
  .pessoas button.ativo { border-color:var(--vermelho); background:var(--vermelho-claro); }
  .pessoas .inicial { flex:none; width:36px; height:36px; border-radius:50%; background:var(--grafite); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .pessoas small { display:block; color:var(--tinta-fraca); }
  .modulos { display:grid; gap:8px; }
  .modulo { display:flex; align-items:center; gap:12px; width:100%; min-height:64px; padding:10px 12px; border:1.5px solid #C9CED6; border-radius:var(--raio); background:#fff; cursor:pointer; text-align:left; }
  .modulo:disabled { cursor:default; background:#F8F9FA; }
  .modulo .sigla { flex:none; width:42px; height:42px; border-radius:8px; background:var(--grafite); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; letter-spacing:.04em; }
  .modulo:disabled .sigla { background:#9BA1AB; }
  .modulo .meio { flex:1; min-width:0; } .modulo b { display:block; font-size:15.5px; } .modulo small { display:block; color:var(--tinta-fraca); font-size:12.5px; }
  .modulo .seta { flex:none; color:var(--tinta-fraca); font-size:20px; }
  .aviso-item { display:grid; gap:8px; }
  .aviso-item + .aviso-item { border-top:1px solid var(--linha); padding-top:12px; margin-top:4px; }
  .aviso-item .linha1 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .aviso-item .linha1 b { font-size:15.5px; flex:1; min-width:0; }
  .aviso-item img { width:100%; height:auto; border-radius:8px; background:#ECEDF0; display:block; }
  .resumo { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px; margin:0; } .resumo dt { color:var(--tinta-media); } .resumo dd { margin:0; min-width:0; overflow-wrap:anywhere; }
  .abas { display:grid; grid-template-columns:repeat(3,1fr); background:#fff; border-top:1px solid var(--linha); padding-bottom:env(safe-area-inset-bottom,0px); position:sticky; bottom:0; z-index:5; }
  .abas button { border:0; background:none; min-height:56px; font-size:12.5px; font-weight:600; color:var(--tinta-fraca); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; position:relative; }
  .abas button i { font-style:normal; font-size:17px; line-height:1; }
  .abas button.ativo { color:var(--vermelho); box-shadow:inset 0 3px 0 var(--vermelho); }
  .abas .bolinha { position:absolute; top:8px; left:calc(50% + 8px); min-width:18px; height:18px; border-radius:9px; background:var(--vermelho); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 5px; }
  footer { text-align:center; font-size:12px; color:var(--tinta-fraca); padding:4px 0 8px; }
</style>
</head>
<body>
<header class="topo">
  <span class="t">Compel</span>
  <span id="sinal" class="sinal off">Sem sinal</span>
  <span id="codigo" class="cod"></span>
</header>
<button id="barraVersao" type="button" class="barra-versao oculto" data-acao="atualizar">Versão nova do app instalada. Toque para usar.</button>
<main id="corpo" aria-live="polite"><div class="cartao"><p class="media">Abrindo…</p></div></main>
<nav id="abas" class="abas oculto">
  <button type="button" data-aba="inicio"><i>⌂</i>Início</button>
  <button type="button" data-aba="avisos"><i>✉</i>Avisos<span id="bolinha" class="bolinha oculto"></span></button>
  <button type="button" data-aba="perfil"><i>☺</i>Perfil</button>
</nav>
<!-- O endereço do login vem num arquivo só, e nenhum caminho em uso o troca (config/login.js explica por quê). -->
<script src="config/login.js"></script>
<script src="app.js"></script>
</body>
</html>
