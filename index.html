<title>App Compel</title>

<!--
  A CASCA DO APP COMPEL (21/10/2026). Entrada, Início, Avisos e Perfil; os blocos de cada frente entram depois, cada um
  na pasta dele (blocos/<bloco>/).

  O VISUAL É O DO PORTAL (pedido do Dalton, 21/10/2026). A folha é a do Núcleo, copiada em estilo/nucleo.css (o app
  mora fora do Google e abre sem sinal, então não pode chamar o Nucleo.css()), e as três fontes vêm da pasta
  estilo/fontes. A marca é o vetor oficial do Núcleo (Marca.html), declarado uma vez aqui embaixo e reaproveitado com
  <use>, como no Portal. O que só o app tem fica nesta folha, com o prefixo app-.
-->
<link rel="stylesheet" href="estilo/fontes.css">
<link rel="stylesheet" href="estilo/nucleo.css">
<style>
  /* O corpo vira coluna para as abas ficarem no pé da tela, e o conteúdo rolar entre a barra e as abas. */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  main { flex: 1; min-width: 0; }
  .topo .acoes { gap: 10px; }
  /* Com sinal / sem sinal: em campo é a primeira pergunta, e a resposta fica no topo de toda tela de dentro. */
  .app-sinal { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .app-sinal::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .app-sinal.off { background: var(--ambar-claro); color: #8A5A00; } .app-sinal.on { background: var(--verde-claro); color: var(--verde); }
  .barra-versao { background: var(--grafite-claro); color: #fff; border: 0; width: 100%; min-height: 48px; font: inherit; font-weight: 600; cursor: pointer; }
  /* O "!" do relato, na barra grafite, e o que a tela do relato e os avisos da pessoa precisam (casca 1.9, 26/10/2026). */
  /* O fundo e o canto são os do .topo button da folha (o mesmo botão da barra do Portal); aqui só o tamanho do "!",
     grande o bastante para ser visto no sol (visto na tela em 26/10/2026: a 14px da folha, ele sumia). */
  .topo .app-relatar { flex: 0 0 auto; width: 44px; padding: 0; margin-right: 10px; font-size: 22px; font-weight: 700; line-height: 1; }
  .topo .app-relatar:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .app-texto-longo { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1.5px solid var(--linha); border-radius: var(--raio-p);
    font: 17px 'Inter', sans-serif; color: var(--tinta); resize: vertical; }
  .app-texto-longo:focus { outline: none; border-color: var(--vermelho); box-shadow: 0 0 0 3px var(--vermelho-claro); }
  .app-pessoal { border-left: 4px solid var(--vermelho); }
  .app-texto { margin: 6px 0; font-size: 16px; line-height: 1.5; }
  .app-print { margin: 6px 0; }
  /* O Acesso rápido (casca 1.11, 27/10/2026): dois botões por linha no celular, com o alvo de toque da folha (--toque) e
     mais um pouco, porque é o botão mais usado do app e muita gente toca de luva. O cartão branco com a sombra da folha
     é o mesmo do .n-modulo, para os dois lerem como "toque aqui"; o nome do sistema embaixo diz de onde vem o formulário. */
  .app-atalhos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 6px; }
  .app-atalho { min-height: 84px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; text-align: left;
    padding: 12px 14px; border: 1px solid var(--linha); border-radius: var(--raio); background: var(--superficie); box-shadow: var(--sombra);
    font: inherit; color: var(--tinta); cursor: pointer; }
  .app-atalho:disabled { opacity: .55; cursor: not-allowed; }
  .app-atalho-icone { font-size: 24px; line-height: 1; }
  .app-atalho-nome { font-weight: 600; font-size: 15px; line-height: 1.25; }
  .app-atalho-de { font-size: 12.5px; color: var(--tinta-media); }
  /* O nome do grupo (a coluna GRUPO da MODULOS) acima dos cartões dele: um rótulo, e não uma seta que abre e fecha,
     porque no celular de quem vai a campo os cartões são poucos e um toque a mais para chegar ao sistema não paga. */
  .app-grupo { margin: 18px 0 10px; }
  /* Erro ou sugestão (casca 1.10, 27/10/2026): dois botões lado a lado, com o alvo de toque da folha (--toque, 52px).
     O marcado leva o --vermelho-forte no texto, e não o --vermelho da marca, que reprova como texto (o comentário do
     :root da folha). Medido pela fórmula de luminância da WCAG em 27/10/2026, sobre os valores da folha: 6,12:1 sobre o
     --vermelho-claro. O marcado também muda a borda, para não depender só da cor. */
  .app-tipos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .app-tipo { min-height: var(--toque); padding: 10px 12px; border: 1.5px solid var(--linha); border-radius: var(--raio-p);
    background: var(--superficie); color: var(--tinta-media); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .app-tipo.app-tipo-marcado { border: 2px solid var(--vermelho-forte); background: var(--vermelho-claro); color: var(--vermelho-forte); }
  /* A entrada: quem já entrou neste celular, com a inicial no círculo grafite. */
  .app-rotulo { margin: 0 0 8px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-media); }
  .app-pessoas { display: grid; gap: 8px; margin-bottom: 14px; }
  .app-pessoas button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: var(--toque); padding: 8px 12px; border: 1px solid var(--linha); border-radius: var(--raio); background: var(--superficie); font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .app-pessoas button.ativo { border: 2px solid var(--vermelho); background: var(--vermelho-claro); }
  .app-inicial { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--grafite); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .app-quem { flex: 1; min-width: 0; } .app-quem b { display: block; } .app-quem small { display: block; color: var(--tinta-fraca); font-size: 13px; }
  .app-ola { margin: 4px 0 10px; }
  .app-sem-margem { margin-top: 0; }
  .app-versao { text-align: center; font-size: 12px; color: var(--tinta-fraca); margin-top: 8px; }
  .login-tela .cartao .btn + .btn { margin-top: 10px; }
  /* Os avisos: a categoria e o "novo" na mesma linha, como o painel de comunicações do Portal. */
  .aviso-item { display: grid; gap: 6px; margin-bottom: 12px; }
  .app-linha { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .app-cat { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; font-weight: 700; padding: 4px 10px; border-radius: 3px; background: #EEF0F2; color: #3F4449; }
  .app-novo { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; padding: 3px 9px; border-radius: 3px; background: var(--vermelho-forte); color: #fff; }
  .app-titulo { font-family: 'Josefin Sans', 'Inter', sans-serif; font-size: 20px; line-height: 1.22; }
  .app-data { font-size: 13.5px; color: var(--tinta-media); }
  .aviso-item img { width: 100%; height: auto; border-radius: 8px; background: #EEF0F3; display: block; object-fit: contain; }
  .app-resumo { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 15px; }
  .app-resumo dt { color: var(--tinta-media); } .app-resumo dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  /* As abas de baixo: só o app tem (o Portal é de computador e celular, o app é só de celular). */
  /* As colunas se ajustam ao número de abas: a de Envio só aparece quando algum bloco envia. */
  .app-abas { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--superficie); border-top: 1px solid var(--linha); padding-bottom: env(safe-area-inset-bottom, 0px); position: sticky; bottom: 0; z-index: 30; }
  .app-abas button { border: 0; background: none; min-height: 60px; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-fraca); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; }
  .app-abas button i { font-style: normal; font-size: 18px; line-height: 1; }
  .app-abas button.ativo { color: var(--vermelho-forte); box-shadow: inset 0 3px 0 var(--vermelho); }
  .app-bolinha { position: absolute; top: 8px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--vermelho); color: #fff; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
  /* A tela de Envio (APP-08): um cartão por bloco que envia. */
  .app-envio .app-linha { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .app-ultimo { margin: 8px 0; }
  /* O termo (APP-09): o texto vem do Núcleo com as quebras de linha dele. */
  .app-termo-texto { white-space: pre-line; margin: 10px 0 14px; }
  .app-acordadas { margin-top: 10px; font-size: 13px; color: var(--tinta-fraca); }
  .app-acordadas summary { cursor: pointer; }
  .app-acordadas ul { margin: 6px 0 0; padding-left: 18px; }
</style>
