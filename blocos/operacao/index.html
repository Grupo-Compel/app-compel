<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#231F20">
<title>Compel · Operação</title>
<!-- No App Compel desde 27/10/2026 (blocos/operacao/): a instalação, o ícone e o service worker são os da casca, um só
     para o app inteiro; esta página é a tela do celular do bloco da Operação, aberta pelo Início do app. -->
<link rel="icon" href="../../icone-192.png">
<!-- O visual é o do protótipo 3.4 (Dalton, 07/10/2026: "não deixe de entregar da
     forma como estava no protótipo"): grafite e vermelho, as quatro abas do
     celular (OPE-14 a OPE-17). Fonte do sistema: em campo não há sinal para
     baixar fonte, e o app tem de abrir igual com e sem rede. -->
<style>
  :root {
    color-scheme: light;
    --fundo:#F4F5F7; --superficie:#FFFFFF; --tinta:#231F20; --tinta-media:#5A5C63; --tinta-fraca:#8B8E96; --linha:#E2E4E8;
    --vermelho:#ED1C24; --vermelho-forte:#B2101F; --vermelho-claro:#FDEBEC;
    --ambar:#8A5600; --ambar-claro:#FFF3DC; --verde:#0E7A47; --verde-claro:#E4F4EB; --grafite:#231F20; --grafite-claro:#3A3639;
    --azul:#1F5E8C; --azul-claro:#E6EFF6; --raio:10px; --toque:48px;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--fundo); color:var(--tinta); font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display:flex; flex-direction:column; }
  button, input, select, textarea { font:inherit; color:inherit; }
  .oculto { display:none !important; }
  .topo { background:var(--grafite); color:#fff; padding:calc(10px + env(safe-area-inset-top,0px)) 14px 9px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  .topo .t { font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:14px; }
  .topo .cod { font-size:10px; letter-spacing:.14em; color:rgba(255,255,255,.5); margin-left:auto; }
  .sinal { font-size:12px; font-weight:600; padding:3px 9px; border-radius:12px; display:flex; align-items:center; gap:6px; }
  .sinal::before { content:''; width:8px; height:8px; border-radius:50%; background:currentColor; }
  .sinal.off { background:#4A3A12; color:#FFC95C; } .sinal.on { background:#123A26; color:#6FE0A5; }
  main { flex:1; overflow-y:auto; padding:12px 12px 24px; display:grid; gap:10px; align-content:start; max-width:640px; width:100%; margin:0 auto; }
  main > * { min-width:0; }
  .cartao { background:var(--superficie); border:1.5px solid #C9CED6; border-radius:var(--raio); padding:13px; box-shadow:0 1px 3px rgba(35,31,32,.08); }
  .etiqueta { font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--tinta-media); margin-bottom:6px; }
  .fraco { color:var(--tinta-fraca); } .media { color:var(--tinta-media); }
  .ajuda { font-size:12.5px; color:var(--tinta-fraca); margin-top:4px; }
  label { display:block; font-size:13px; color:var(--tinta-media); margin:10px 0 4px; }
  input, select, textarea { width:100%; min-height:var(--toque); padding:10px 11px; border:1.5px solid var(--linha); border-radius:8px; background:#fff; }
  textarea { min-height:70px; }
  input:focus, select:focus, textarea:focus { outline:3px solid var(--azul-claro); border-color:var(--azul); }
  .duas { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .duas > div { min-width:0; }
  .hora { display:flex; gap:6px; } .hora input { flex:1; min-width:0; } .hora button { flex:none; width:auto; margin:0; padding:0 12px; min-height:var(--toque); font-size:13px; }
  .btn { display:block; width:100%; margin-top:10px; min-height:52px; padding:12px; border:0; border-radius:8px; background:var(--vermelho); color:#fff; font-weight:700; font-size:16px; cursor:pointer; text-align:center; text-decoration:none; }
  .btn.secundario { background:transparent; color:var(--vermelho); border:1.5px solid var(--vermelho); }
  .btn.fantasma { background:transparent; color:var(--tinta-media); border:1.5px solid var(--linha); font-weight:600; }
  .btn.medio { min-height:var(--toque); font-size:14px; }
  .btn:disabled { opacity:.45; }
  .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:0; border:1.5px solid var(--linha); border-radius:8px; overflow:hidden; }
  .seg button { border:0; border-left:1px solid var(--linha); background:#fff; min-height:var(--toque); padding:6px 4px; font-size:13.5px; font-weight:600; color:var(--tinta-media); cursor:pointer; }
  .seg button:first-child { border-left:0; }
  .seg button.ativo { background:var(--grafite); color:#fff; }
  .seg.foi button.ativo[data-v="foi"] { background:var(--verde); } .seg.foi button.ativo[data-v="faltou"] { background:var(--vermelho-forte); }
  .pessoa { display:grid; grid-template-columns:1fr 150px; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--linha); }
  .pessoa:first-of-type { border-top:0; }
  .pessoa b { display:block; font-size:14px; } .pessoa small { color:var(--tinta-fraca); }
  .aviso { padding:10px 12px; border-radius:8px; font-size:14px; background:var(--azul-claro); color:var(--azul); }
  .aviso.atencao { background:var(--ambar-claro); color:var(--ambar); } .aviso.erro { background:var(--vermelho-claro); color:var(--vermelho-forte); } .aviso.ok { background:var(--verde-claro); color:var(--verde); }
  .aviso ul { margin:6px 0 0 18px; padding:0; }
  .erro-campo { color:var(--vermelho-forte); font-size:13px; margin-top:4px; }
  .chip { display:inline-block; font-size:12px; font-weight:700; padding:2px 9px; border-radius:12px; background:var(--azul-claro); color:var(--azul); }
  .chip.rascunho { background:var(--ambar-claro); color:var(--ambar); } .chip.encerrado { background:var(--azul-claro); color:var(--azul); }
  .chip.enviado { background:var(--verde-claro); color:var(--verde); } .chip.recusado, .chip.cortado { background:var(--vermelho-claro); color:var(--vermelho-forte); }
  .chip.jaLancado { background:#ECEDF0; color:var(--tinta-media); }
  .folha { display:grid; gap:4px; }
  .folha .linha1 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .folha .linha1 b { font-size:15.5px; }
  .dias { display:flex; gap:6px; } .dias button { flex:1; }
  .codigo { display:grid; grid-template-columns:1fr 88px 70px 36px; gap:6px; align-items:end; padding:6px 0; border-top:1px solid var(--linha); }
  .codigo:first-of-type { border-top:0; }
  .codigo .desc { grid-column:1 / -1; font-size:12.5px; color:var(--tinta-media); margin-top:-2px; }
  .codigo .tirar { border:0; background:none; font-size:20px; color:var(--tinta-fraca); min-height:var(--toque); cursor:pointer; }
  .fotos { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .foto { border:1.5px dashed var(--linha); border-radius:8px; min-height:110px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:8px; font-size:13px; color:var(--tinta-media); cursor:pointer; position:relative; background:#fff; }
  .foto img { max-width:100%; max-height:120px; border-radius:6px; display:block; }
  .foto.ok { border-style:solid; border-color:var(--verde); }
  .foto input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .resumo { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:14px; } .resumo dt { color:var(--tinta-media); } .resumo dd { margin:0; }
  .abas { display:grid; grid-template-columns:repeat(4,1fr); background:#fff; border-top:1px solid var(--linha); padding-bottom:env(safe-area-inset-bottom,0px); position:sticky; bottom:0; z-index:5; }
  .abas button { border:0; background:none; min-height:56px; font-size:12.5px; font-weight:600; color:var(--tinta-fraca); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .abas button i { font-style:normal; font-size:17px; line-height:1; }
  .abas button.ativo { color:var(--vermelho); box-shadow:inset 0 3px 0 var(--vermelho); }
  .grande { font-size:34px; font-weight:800; letter-spacing:.12em; text-align:center; }
  ul.lista { list-style:none; padding:0; margin:0; } ul.lista li { border-top:1px solid var(--linha); padding:9px 0; font-size:14px; } ul.lista li:first-child { border-top:0; }
  a { color:var(--azul); } ul.lista a { color:inherit; text-decoration:none; } ul.lista a b { text-decoration:underline; text-decoration-color:var(--linha); }
  details summary { cursor:pointer; color:var(--azul); font-weight:600; min-height:var(--toque); display:flex; align-items:center; }
  /* 5b: o dia em horários (as cores dos registros são as do protótipo 3.4) */
  ul.registros li.reg { display:grid; grid-template-columns:116px 1fr; gap:8px; align-items:center; border-left:4px solid #8E97A6; padding-left:8px; margin:4px 0; }
  ul.registros li.reg input { min-height:40px; padding:6px; }
  ul.registros li.reg small { display:block; color:var(--tinta-fraca); }
  li.reg-servico { border-left-color:var(--verde) !important; } li.reg-parada { border-left-color:var(--ambar) !important; }
  li.reg-almoco { border-left-color:#C9CDD4 !important; } li.reg-chegada { border-left-color:var(--grafite) !important; }
  .toques { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; } .toques .btn { margin-top:0; }
  .toques .btn:last-child:nth-child(odd) { grid-column:1 / -1; }
  .folha-resumo { border-top:1px solid var(--linha); padding-top:8px; margin-top:8px; } .folha-resumo:first-of-type { border-top:0; margin-top:0; padding-top:0; }
  /* 5b.1 (pedido do Dalton no teste de 13/10/2026): cada caixa com o cabeçalho marcado, as seções do diário
     numeradas, a escolha Obra ou Emergência na aba Hoje, o próximo registro do dia e os blocos que abrem e fecham. */
  .cartao > .etiqueta:first-child { margin:-13px -13px 10px; padding:9px 13px; background:#EEF0F3; border-bottom:1.5px solid #C9CED6; border-radius:var(--raio) var(--raio) 0 0; color:var(--tinta); }
  .cartao.secao > .etiqueta:first-child { background:var(--grafite); color:#fff; border-bottom:0; display:flex; align-items:center; gap:9px; font-size:12.5px; }
  .etiqueta .n { flex:none; width:24px; height:24px; border-radius:50%; background:var(--vermelho); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:13px; letter-spacing:0; }
  .obrig { font-size:10.5px; padding:1px 7px; border-radius:10px; background:var(--vermelho); color:#fff; letter-spacing:.04em; margin-left:auto; }
  .escolha { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .escolha button { min-height:104px; border:2px solid #C9CED6; border-radius:var(--raio); background:#fff; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--tinta-media); }
  .escolha button b { font-size:17px; color:var(--tinta); } .escolha button .num { font-size:30px; font-weight:800; line-height:1.1; color:var(--tinta); } .escolha button small { font-size:12px; }
  .escolha button.ativo { border-color:var(--vermelho); background:var(--vermelho-claro); } .escolha button.ativo .num { color:var(--vermelho-forte); }
  .folha .horario { font-size:18px; font-weight:800; color:var(--vermelho-forte); }
  .agora { background:var(--azul-claro); color:var(--azul); border-radius:8px; padding:9px 11px; margin-top:10px; font-size:14.5px; } .agora small { display:block; font-size:12.5px; margin-top:2px; }
  .toques.outros { grid-template-columns:repeat(3,1fr); } .toques.outros .btn { min-height:44px; font-size:13px; padding:6px; }
  .toques .btn.escolhido { box-shadow:0 0 0 3px var(--grafite); }
  .formToque { border:2px solid var(--grafite); border-radius:var(--raio); padding:12px; margin-top:12px; background:#FAFAFB; }
  .formToque > .etiqueta:first-child { margin:-12px -12px 6px; padding:8px 12px; background:var(--grafite); color:#fff; border-radius:8px 8px 0 0; }
  details.bloco { border:1.5px solid #C9CED6; border-radius:8px; margin-top:10px; background:#fff; }
  details.bloco > summary { padding:0 12px; justify-content:space-between; gap:8px; color:var(--tinta); font-weight:700; }
  details.bloco > summary::before { content:'▸'; color:var(--tinta-fraca); font-size:14px; } details.bloco[open] > summary::before { content:'▾'; }
  details.bloco > summary > span:first-of-type { flex:1; }
  details.bloco .dentro { padding:0 12px 12px; }
  details.bloco details.bloco { margin-top:12px; }
  .sit { font-size:12px; font-weight:700; padding:2px 9px; border-radius:12px; white-space:nowrap; } .sit.ok { background:var(--verde-claro); color:var(--verde); } .sit.falta { background:var(--ambar-claro); color:var(--ambar); }
  /* 5c: o book da obra, as estruturas como botões coloridos (o quadro "Book da obra" do protótipo 3.0). */
  .lugares { display:grid; grid-template-columns:repeat(auto-fill, minmax(66px, 1fr)); gap:6px; margin:8px 0 2px; }
  .lugar { min-height:44px; border:2px solid #C9CED6; border-radius:8px; background:#fff; font-weight:700; font-size:14px; cursor:pointer; color:var(--tinta); }
  .lugar.parcial { background:var(--ambar-claro); border-color:#E2B866; } .lugar.pronta { background:var(--verde-claro); border-color:#7CC7A0; color:var(--verde); }
  .lugar.geral { background:#EEF0F3; } .lugar.sel { box-shadow:0 0 0 3px var(--grafite); }
  .lugarSel { border:2px solid var(--grafite); border-radius:var(--raio); padding:12px; margin-top:12px; }
  .lugarSel > .etiqueta:first-child { margin:-12px -12px 8px; padding:8px 12px; background:var(--grafite); color:#fff; border-radius:8px 8px 0 0; }
  .foto.antes { border-style:solid; border-color:#7CC7A0; background:var(--verde-claro); }
  .sit.vazio { background:#EEF0F3; color:var(--tinta-media); }
  button.link { background:none; border:0; color:var(--azul); text-decoration:underline; padding:4px 0; font-size:13px; cursor:pointer; display:inline; }
  footer { text-align:center; color:var(--tinta-fraca); font-size:12px; padding:6px 0 4px; }
/* 5e: a APR da folha. */
.apr-bloco { border-top: 1px solid var(--linha); margin-top: 10px; padding-top: 8px; }
.apr-titulo { font-weight: 700; font-size: 13.5px; margin: 4px 0 6px; }
.apr-q { display: grid; grid-template-columns: 1fr; gap: 4px; padding: 6px 0; border-bottom: 1px dashed var(--linha); font-size: 14px; }
.apr-sn { max-width: 260px; }
.apr-item { margin: 8px 0; }
.apr-marca { display: block; width: 100%; text-align: left; background: #fff; border: 1.5px solid var(--linha); border-radius: 8px; padding: 8px 10px; font-weight: 700; font-size: 14px; min-height: var(--toque); }
.apr-marca.ativo { border-color: var(--tinta-media); }
.apr-marcas { display: flex; flex-wrap: wrap; gap: 6px; }
.apr-marcas button { background: #fff; border: 1.5px solid var(--linha); border-radius: 18px; padding: 6px 10px; font-size: 13.5px; min-height: 36px; }
.apr-marcas button.ativo { border-color: var(--tinta-media); font-weight: 700; }
.apr-imp { background: #FFF7E0; padding: 8px; border-radius: 8px; border: 0; }
/* 2f: o projeto da obra, aberto do que está guardado no celular. */
#visorProjeto { position: fixed; inset: 0; z-index: 50; background: #2B2729; display: flex; flex-direction: column; }
#visorProjeto .visor-barra { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #1C191B; color: #fff; }
#visorProjeto .visor-barra b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
#visorProjeto .visor-barra button { background: #fff; color: #1C191B; border: 0; border-radius: 6px; min-width: 40px; height: 36px; font-size: 15px; font-weight: 700; padding: 0 10px; }
#visorProjeto .visor-zoom { color: #fff; font-size: 13px; min-width: 44px; text-align: center; }
#visorProjeto .visor-paginas { flex: 1; overflow: auto; padding: 4px; -webkit-overflow-scrolling: touch; }
#visorProjeto .visor-paginas canvas { display: block; background: #fff; margin: 0 0 6px; }
#visorProjeto .visor-paginas .aviso, #visorProjeto .visor-paginas .ajuda { color: #fff; }
#visorProjeto .visor-pe { padding: 8px 10px; background: #1C191B; color: #ddd; font-size: 13px; }
#visorProjeto .visor-pe a { color: #fff; font-weight: 700; }
.projeto { margin-top: 6px; }
/* O voltar ao App Compel, no canto da barra (27/10/2026): a tela do bloco abre por cima do Início do app. */
.topo .volta { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 6px; min-width: 40px; height: 36px; font-size: 22px; line-height: 1; padding: 0 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="topo"><button type="button" class="volta" id="voltarApp" aria-label="Voltar ao app">‹</button><span class="t">Compel · Campo</span><span class="sinal off" id="chipSinal">Sem sinal</span><span class="cod" id="codTela">OPE-14</span></div>
<main id="corpo"><div class="cartao">Abrindo…</div></main>
<nav class="abas oculto" id="abas">
  <button type="button" data-aba="hoje"><i>◷</i>Hoje</button>
  <button type="button" data-aba="diario"><i>✎</i>Diário</button>
  <button type="button" data-aba="encerrar"><i>✓</i>Encerrar</button>
  <button type="button" data-aba="envio"><i>⇅</i><span id="rotEnvio">Envio</span></button>
</nav>
<!-- A casca primeiro (blocos/README.md): a entrada do dia, o servidor conferido, a fila e o objeto Casca. -->
<script src="../../config/login.js"></script>
<script src="../../servicos.js"></script>
<script src="../indice.js"></script>
<script src="../../casca.js"></script>
<script src="fila.js"></script>
<script src="app.js"></script>
</body>
</html>
